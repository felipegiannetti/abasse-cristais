<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-label="Abasse Crystal">
  <!-- LOGO PROVISÓRIO: substitua este arquivo (public/logo.svg) pela logo oficial. Mantenha proporção ~4:1. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9fff6"/>
